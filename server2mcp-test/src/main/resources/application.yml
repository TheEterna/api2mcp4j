spring:
  application:
    name: plug
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        name: test-mcp
        version: 1.0.0
        type: SYNC
        tool-response-mime-type:
          readJPEGImage: image/jpg
#        protocol: streamable
        request-timeout: 6000s

#        streamable-http:
#          mcp-endpoint: /api/mcp
#          keep-alive-interval: 600s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://[REDACTED-MYSQL-HOST]:3306/yizi?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
    username: root
    [REDACTED-MYSQL-PASSWORD]
plugin:
  mcp:
    enabled: true
    parser:
      param: MCPTOOL, JAVADOC, TOOL,
      des: MCPTOOL, JAVADOC, TOOL, JACKSON, SWAGGER3, SWAGGER2
#      param: JAVADOC
#      des: JAVADOC
    scope: interface
    resource:
      enabled: true
    tool:
      enabled: true
    complete:
      enabled: true
    prompt:
      enabled: true

logging:
  level:
    org.springframework.ai: DEBUG
    io.modelcontextprotocol: DEBUG
    com.ai.plug: DEBUG
server:
  port: 8888


